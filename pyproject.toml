[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "causeforge"
version = "0.1.0"
description = "A budgeted interventional data engine for agent improvement"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7",
    "pytest>=8",
]

[project.scripts]
causeforge = "causeforge.cli:main"

[tool.setuptools.packages.find]
include = ["causeforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
