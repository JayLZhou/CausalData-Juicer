[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "causal-data-juicer"
version = "0.1.0"
description = "A budgeted interventional data engine for agent improvement"
readme = "README.md"
license = {text = "Apache-2.0"}
keywords = ["agents", "counterfactual", "training-data", "causal", "llm"]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7",
    "pytest>=8",
    "pyyaml>=6",
]

[project.scripts]
cdj = "causal_data_juicer.cli:main"
causal-data-juicer = "causal_data_juicer.cli:main"

[tool.setuptools.packages.find]
include = ["causal_data_juicer*", "causeforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
