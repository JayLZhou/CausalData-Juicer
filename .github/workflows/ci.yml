# Gate order: lint → types → tests+coverage → package → docs → security.
# Actions are pinned to full commit SHAs (dependabot keeps them fresh).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install ruff mypy && pip install -e .
      - run: ruff check causal_data_juicer tests examples
      - run: ruff format --check causal_data_juicer tests examples
      - run: mypy causal_data_juicer

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false        # one red cell must not hide the others' verdicts
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12"]
        include:
          - os: macos-latest        # smoke tier
            python-version: "3.12"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e . && pip install coverage
      # Pull the isolation image here, with retries, so a Docker Hub rate
      # limit fails as an infrastructure step instead of masquerading as
      # "the container backend is broken".
      - name: pre-pull isolation image
        if: matrix.os == 'ubuntu-latest'
        run: |
          for i in 1 2 3; do
            docker pull python:3.12-slim && exit 0
            echo "pull attempt $i failed; retrying"; sleep 15
          done
          exit 1
      # ubuntu runners ship Docker: prove the container isolation path for
      # real there (a silent fallback to netns would hide a broken backend)
      - name: tests
        run: |
          set -o pipefail
          coverage run -m pytest tests/ -q 2>&1 | tee /tmp/pytest.log
        env:
          CDJ_REQUIRE_CONTAINER: ${{ matrix.os == 'ubuntu-latest' && '1' || '0' }}
      # Failure detail as annotations: readable from the public API without a
      # log download, so a red run can be triaged from anywhere.
      - name: failure diagnostics
        if: failure()
        run: |
          python - > /tmp/probe.txt 2>&1 <<'PY' || true
          from causal_data_juicer.runtime.exec_backend import probe
          caps = probe()
          print(f"level={caps.level} detail={caps.detail}")
          PY
          echo "::error title=isolation-probe::$(tr '\n|%' '   ' < /tmp/probe.txt | cut -c1-900)"
          if [ -f /tmp/pytest.log ]; then
            echo "::error title=pytest-failures::$(grep -E '^(FAILED|ERROR)|^E ' /tmp/pytest.log | head -25 | tr '\n|%' '   ' | cut -c1-1500)"
            echo "::error title=pytest-tail::$(tail -c 1200 /tmp/pytest.log | tr '\n|%' '   ')"
          fi
      # overall gate is a ratchet: 60 now (truth: 63%), raising toward 80
      - run: coverage report --fail-under=60
      # the security boundary is held to a higher bar
      - run: >
          coverage report --fail-under=90
          --include="*/runtime/paths.py,*/runtime/context.py,*/runtime/rundir.py,*/store/blob.py,*/runtime/exec_backend.py,*/verify_claims.py,*/runtime/llm.py"

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      # clean-environment install smoke: the wheel alone must be able to demo
      - run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          cd /tmp && /tmp/clean/bin/cdj demo --out /tmp/ci-demo --repro 2
          /tmp/clean/bin/cdj report /tmp/ci-demo | grep "FLIP REPRO"

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -e . && pip install mkdocs-material "mkdocstrings[python]"
      - run: mkdocs build --strict

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install pip-audit && pip install -e .
      - run: pip-audit
